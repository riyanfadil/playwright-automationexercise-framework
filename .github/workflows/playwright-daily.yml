name: Playwright Daily Test + Email Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  
  schedule:
    - cron: '0 15 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      # === ZIP REPORT SEBELUM DIKIRIM ===
      - name: Zip Playwright Report
        if: always()
        run: |
          if [ -d "playwright-report" ]; then
            zip -r playwright-report.zip playwright-report/
          else
            echo "No report folder found"
            mkdir -p playwright-report
            echo "Test completed but no report generated" > playwright-report/index.html
            zip -r playwright-report.zip playwright-report/
          fi

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # === KIRIM EMAIL DENGAN ATTACHMENT ===
      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🧪 Playwright Daily Report - ${{ job.status }}"
          to: ${{ secrets.REPORT_EMAIL }}
          from: Playwright Automation <noreply@github.com>
          body: |
            Playwright Daily Test telah selesai dijalankan.

            **Status**: ${{ job.status }}
            **Repository**: ${{ github.repository }}
            **Waktu**: ${{ github.event.schedule || 'Manual Trigger' }}
            
            Report lengkap ada di attachment.
          attachments: playwright-report.zip
          convert_markdown: true